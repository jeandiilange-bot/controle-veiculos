<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Controle de Veículos</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0A1E33" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="icon" href="icon-192.png" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap');

  :root {
    --bg: #0A1E33;
    --panel: #0F2C4D;
    --card: #123A5E;
    --card-alt: #163F66;
    --card-alt2: #153A5F;
    --border: #2A5478;
    --blue: #1B5A9E;
    --blue-light: #3E8FD0;
    --chrome: #C7D0D6;
    --amber: #D9A441;
    --green: #4F9A6B;
    --red: #C24A42;
    --text: #F2F5F7;
    --text-muted: #9BB0C2;
    --text-faint: #5F7690;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; }
  button, input, select { font-family: inherit; }
  ::placeholder { color: var(--text-faint); }
  select { -webkit-appearance: none; appearance: none; }
  select:disabled { opacity: 0.5; }

  @page { size: A4 landscape; margin: 10mm; }

  .header { padding: 20px 18px 16px; border-bottom: 3px solid var(--blue-light); background: var(--panel); }
  .title { font-family: 'Oswald', sans-serif; font-size: 26px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em; }
  .date { font-family: 'Inter', sans-serif; font-size: 13px; color: var(--text-muted); margin-top: 2px; text-transform: capitalize; }
  .subnote { font-family: 'Inter', sans-serif; font-size: 11.5px; color: var(--text-faint); margin-top: 2px; }
  .stats { display: flex; gap: 10px; margin-top: 14px; }
  .stat-box { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 8px; text-align: center; }
  .stat-val { font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700; }
  .stat-label { font-family: 'Inter', sans-serif; font-size: 10.5px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 2px; }

  .controls { padding: 16px 18px 0; }
  .input { width: 100%; box-sizing: border-box; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 15px; outline: none; }
  .select { width: 100%; box-sizing: border-box; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--card-alt); color: var(--text); font-size: 14px; outline: none; }

  .list-wrap { padding: 16px 18px 110px; }
  .empty { text-align: center; color: var(--text-faint); margin-top: 60px; font-size: 14px; }

  .table-container { overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; background: var(--card); }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; padding: 10px; border-bottom: 2px solid var(--blue-light); font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap; }
  th.actions-col { text-align: right; position: sticky; right: 0; background: var(--card); box-shadow: -6px 0 8px -6px rgba(0,0,0,0.4); }
  td { padding: 12px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:nth-child(even) td { background: rgba(255,255,255,0.02); }
  tr:nth-child(even) td.actions-col { background: var(--card-alt2); }
  tr:nth-child(odd) td.actions-col { background: var(--card); }
  td.actions-col { text-align: right; position: sticky; right: 0; box-shadow: -6px 0 8px -6px rgba(0,0,0,0.4); }

  .plate { font-family: 'JetBrains Mono', monospace; color: var(--blue-light); font-size: 14px; letter-spacing: 0.06em; }
  .client-name { font-family: 'Oswald', sans-serif; font-size: 15.5px; font-weight: 600; min-width: 140px; }

  .pill { border-radius: 999px; padding: 5px 12px; font-size: 12.5px; font-weight: 600; border-width: 1px; border-style: solid; display: inline-block; }

  .vcard { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; }
  .vcard-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .vcard-plate { font-family: 'JetBrains Mono', monospace; color: var(--blue-light); font-size: 19px; font-weight: 700; letter-spacing: 0.06em; }
  .vcard-check { width: 26px; height: 26px; flex-shrink: 0; accent-color: var(--blue-light); cursor: pointer; }
  .vcard-client { font-family: 'Oswald', sans-serif; font-size: 16px; font-weight: 600; margin-top: 4px; }
  .vcard-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .vcard-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
  .vcard-user { font-size: 12px; color: var(--text-muted); }
  .vcard-actions { display: flex; gap: 14px; }
  .vcard.conferido { border-color: var(--green); background: linear-gradient(var(--card), var(--card)) padding-box, var(--card); box-shadow: inset 0 0 0 1px rgba(79,154,107,0.35); }

  .row-actions { display: flex; gap: 12px; justify-content: flex-end; }
  .link-btn { background: none; border: none; font-size: 12px; font-weight: 600; padding: 0; }

  .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; padding: 16px; display: flex; gap: 8px; background: linear-gradient(to top, var(--bg) 60%, rgba(10,30,51,0)); }
  .btn-outline { flex: 1; padding: 15px 0; border-radius: 12px; border: 1px solid var(--blue-light); background: transparent; color: var(--blue-light); font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 14px; text-transform: uppercase; letter-spacing: 0.03em; }
  .btn-outline-chrome { flex: 1; padding: 15px 0; border-radius: 12px; border: 1px solid var(--chrome); background: transparent; color: var(--chrome); font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 14px; text-transform: uppercase; letter-spacing: 0.03em; }
  .btn-solid { flex: 1.2; padding: 15px 0; border-radius: 12px; border: none; background: var(--blue-light); color: #052038; font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 14px; text-transform: uppercase; letter-spacing: 0.03em; }

  .drawer-overlay { position: fixed; inset: 0; background: rgba(4,10,18,0.65); z-index: 50; display: none; align-items: flex-end; }
  .drawer-overlay.open { display: flex; }
  .drawer { background: var(--panel); width: 100%; max-height: 90vh; overflow-y: auto; border-radius: 20px 20px 0 0; padding: 20px 20px 28px; border-top: 3px solid var(--blue-light); }
  .drawer.history-drawer { border-top-color: var(--chrome); }
  .drawer-handle { width: 40px; height: 4px; background: var(--border); border-radius: 4px; margin: 0 auto 16px; }
  .drawer-title { font-family: 'Oswald', sans-serif; font-size: 22px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.02em; margin: 0 0 18px; }
  .field-label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; margin: 14px 0 6px; }
  .two-col { display: flex; gap: 12px; }
  .two-col > div { flex: 1; }
  .save-btn { margin-top: 20px; width: 100%; padding: 15px 0; border-radius: 12px; border: none; font-family: 'Oswald', sans-serif; font-size: 16px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; background: var(--blue-light); color: #052038; }

  .error-banner { margin-top: 16px; padding: 10px 14px; border-radius: 8px; background: rgba(194,74,66,0.13); border: 1px solid var(--red); color: #FFD9D4; font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; }

  .history-row { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 14px 4px; background: none; border: none; border-bottom: 1px solid var(--border); text-align: left; }
  .history-back { background: none; border: none; color: var(--chrome); font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; margin-bottom: 12px; padding: 0; }
  .history-empty { text-align: center; color: var(--text-faint); font-family: 'Inter', sans-serif; padding: 30px 0; font-size: 14px; }

  .print-only { display: none; }

  @media print {
    .no-print, .bottom-bar, .header, .controls { display: none !important; }
    body, html { background: #fff !important; color: #000; }
    .print-only { display: block !important; }
  }
</style>
</head>
<body>

<div class="no-print">
  <div class="header">
    <div class="title">Controle de Veículos</div>
    <div class="date" id="todayLabel"></div>
    <div class="subnote">Lista contínua — veículos que ainda estão na oficina permanecem aqui entre os dias</div>
    <div class="stats">
      <div class="stat-box"><div class="stat-val" id="statNaoRealizado" style="color:var(--text-muted)">0</div><div class="stat-label">Não realizado</div></div>
      <div class="stat-box"><div class="stat-val" id="statAndamento" style="color:var(--blue-light)">0</div><div class="stat-label">Em andamento</div></div>
      <div class="stat-box"><div class="stat-val" id="statTotal" style="color:var(--chrome)">0</div><div class="stat-label">Total na lista</div></div>
    </div>
  </div>

  <div class="controls">
    <input class="input" id="searchInput" placeholder="Buscar por cliente ou placa..." />
  </div>

  <div class="list-wrap">
    <div class="empty" id="emptyMsg" style="display:none;">
      Nenhum veículo na lista no momento.<br />Toque em "+ Novo veículo" para começar.
    </div>
    <div id="cardList" style="display:none;"></div>
  </div>

  <div class="bottom-bar">
    <button class="btn-outline-chrome" id="historyBtn">Histórico</button>
    <button class="btn-outline" id="printBtn">Imprimir</button>
    <button class="btn-solid" id="newBtn">+ Novo veículo</button>
  </div>
</div>

<div class="print-only" id="printReport"></div>

<!-- New/Edit vehicle drawer -->
<div class="drawer-overlay" id="drawerOverlay">
  <div class="drawer" onclick="event.stopPropagation()">
    <div class="drawer-handle"></div>
    <h2 class="drawer-title" id="drawerTitle">Novo veículo</h2>

    <div class="two-col">
      <div>
        <label class="field-label">Placa</label>
        <input class="input" id="fPlate" placeholder="ABC-1234 ou ABC1D23" style="font-family:'JetBrains Mono',monospace;letter-spacing:0.06em" autocapitalize="characters" autocorrect="off" autocomplete="off" spellcheck="false" />
      </div>
      <div>
        <label class="field-label">Cliente</label>
        <input class="input" id="fClientName" placeholder="NOME DO CLIENTE" style="text-transform:uppercase" autocapitalize="characters" autocorrect="off" autocomplete="off" spellcheck="false" />
        <div id="clienteStatus" style="display:none; font-family:'Inter',sans-serif; font-size:12px; color:var(--text-faint); margin-top:6px;"></div>
      </div>
    </div>

    <div class="two-col">
      <div>
        <label class="field-label">Tipo</label>
        <select class="select" id="fTipo">
          <option value="" disabled hidden>Selecione</option>
          <option value="Caminhão">Caminhão</option>
          <option value="Cavalo">Cavalo</option>
          <option value="Carreta">Carreta</option>
          <option value="Guindaste">Guindaste</option>
          <option value="Ônibus">Ônibus</option>
          <option value="Outro">Outro</option>
        </select>
      </div>
      <div id="fTipoOutroWrap" style="display:none;">
        <label class="field-label">Qual tipo?</label>
        <input class="input" id="fTipoOutro" placeholder="Digite o tipo" />
      </div>
    </div>

    <div class="two-col">
      <div>
        <label class="field-label">Serviço(s)</label>
        <select class="select" id="fServico">
          <option>Não realizado</option>
          <option>Em andamento</option>
          <option>Finalizado</option>
        </select>
      </div>
      <div>
        <label class="field-label">Chaveiro</label>
        <select class="select" id="fChaveiro"></select>
      </div>
    </div>

    <div class="two-col">
      <div>
        <label class="field-label">Retirada</label>
        <select class="select" id="fRetirada"></select>
      </div>
      <div>
        <label class="field-label">Assinatura</label>
        <select class="select" id="fAssinatura"></select>
      </div>
    </div>

    <div class="two-col">
      <div>
        <label class="field-label">Usuário criação</label>
        <select class="select" id="fUsuario">
          <option value="" disabled hidden>Selecione</option>
          <option value="Guilherme Marinho">Guilherme Marinho</option>
          <option value="Eduardo Cristian">Eduardo Cristian</option>
          <option value="Jean Lange">Jean Lange</option>
          <option value="Outro">Outro</option>
        </select>
      </div>
      <div id="fOutroWrap" style="display:none;">
        <label class="field-label">Nome do usuário</label>
        <input class="input" id="fOutroNome" placeholder="Digite o nome" />
      </div>
    </div>

    <div class="error-banner" id="errorBanner" style="display:none;"></div>

    <button class="save-btn" id="saveBtn">Registrar veículo</button>
  </div>
</div>

<!-- History drawer -->
<div class="drawer-overlay" id="historyOverlay">
  <div class="drawer history-drawer" onclick="event.stopPropagation()">
    <div class="drawer-handle"></div>

    <div id="historyListView">
      <h2 class="drawer-title">Histórico por data</h2>
      <div id="historyListBody"></div>
    </div>

    <div id="historyDetailView" style="display:none;">
      <button class="history-back" id="historyBackBtn">‹ Voltar para lista de datas</button>
      <h2 class="drawer-title" id="historyDetailTitle" style="font-size:20px;margin-bottom:4px;"></h2>
      <div class="subnote" id="historyDetailSubtitle" style="margin-bottom:16px;"></div>
      <div id="historyDetailTableWrap"></div>
      <button class="btn-outline-chrome" id="historyPrintBtn" style="width:100%;margin-top:16px;">Imprimir esta data</button>
    </div>
  </div>
</div>


<script>
(function () {
  var ACTIVE_KEY = "controle_veiculos_ativos";
  var LAST_DATE_KEY = "controle_veiculos_ultima_data";
  var HISTORY_INDEX_KEY = "controle_veiculos_historico_index";
  function historySnapshotKey(date) { return "controle_veiculos_historico_" + date; }

  var USUARIOS_OPTIONS = ["Guilherme Marinho", "Eduardo Cristian", "Jean Lange", "Outro"];
  var TIPO_OPTIONS = ["Caminhão", "Cavalo", "Carreta", "Guindaste", "Ônibus", "Outro"];
  var PLATE_CHAR_RULES = [/[A-Z]/, /[A-Z]/, /[A-Z]/, /[0-9]/, /[0-9A-Z]/, /[0-9]/, /[0-9]/];
  var PLATE_REGEX = /^[A-Z]{3}[0-9][0-9A-Z][0-9]{2}$/;

  var entries = [];
  var search = "";
  var editingId = null;
  var confirmingDeleteId = null;
  var historyIndex = [];
  var selectedHistoryDate = null;
  var historySnapshot = null;
  var printTarget = null; // null = live list; {date, data} = historical

  function todayKey() { return new Date().toISOString().slice(0, 10); }
  function uid() { return Math.random().toString(36).slice(2, 10); }

  function formatDateLabel(dateKey) {
    return new Date(dateKey + "T00:00:00").toLocaleDateString("pt-BR", {
      weekday: "long", day: "2-digit", month: "long", year: "numeric"
    });
  }
  function formatDateShort(dateKey) {
    return new Date(dateKey + "T00:00:00").toLocaleDateString("pt-BR", {
      day: "2-digit", month: "2-digit", year: "numeric"
    });
  }

  function lsGet(key) {
    try {
      var raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }
  function lsSet(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
  }

  function loadHistoryIndex() {
    historyIndex = lsGet(HISTORY_INDEX_KEY) || [];
    return historyIndex;
  }

  function saveHistorySnapshot(date, snapshotEntries) {
    lsSet(historySnapshotKey(date), snapshotEntries);
    var idx = loadHistoryIndex();
    var next = idx.slice();
    var existing = next.find(function (d) { return d.date === date; });
    if (existing) existing.count = snapshotEntries.length;
    else next.push({ date: date, count: snapshotEntries.length });
    next.sort(function (a, b) { return b.date.localeCompare(a.date); });
    lsSet(HISTORY_INDEX_KEY, next);
    historyIndex = next;
  }

  function formatPlate(v) {
    var raw = v.toUpperCase().replace(/[^A-Z0-9]/g, "");
    var out = "";
    for (var i = 0; i < raw.length && out.length < 7; i++) {
      var ch = raw[i];
      if (PLATE_CHAR_RULES[out.length].test(ch)) out += ch;
    }
    return out;
  }
  function displayPlate(v) { return v.length === 7 ? v.slice(0, 3) + "-" + v.slice(3) : v; }
  function escapeHtml(s) {
    var div = document.createElement("div");
    div.innerText = s;
    return div.innerHTML;
  }

  function servicoColor(v) {
    if (v === "Em andamento") return "var(--blue-light)";
    if (v === "Finalizado") return "var(--green)";
    return "var(--text-muted)";
  }
  function retiradaColor(v) {
    if (v === "SIM") return "var(--green)";
    if (v === "NÃO") return "var(--red)";
    return "var(--text-faint)";
  }
  function assinaturaColor(v) {
    if (v === "SIM") return "var(--green)";
    if (v === "NÃO") return "var(--red)";
    if (v === "###") return "var(--amber)";
    return "var(--text-faint)";
  }
  function pillHtml(label, color) {
    return '<span class="pill" style="border-color:' + color + ';background:' + color + '22;color:' + color + '">' + (escapeHtml(label) || "—") + "</span>";
  }

  // ---- Main render ----
  function sortByPlate(list) {
    return list.slice().sort(function (a, b) {
      return displayPlate(a.plate).localeCompare(displayPlate(b.plate), "pt-BR");
    });
  }

  function formatPrintedAt() {
    return new Date().toLocaleString("pt-BR", {
      day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit"
    });
  }

  function render() {
    var filtered = sortByPlate(entries).filter(function (e) {
      var q = search.trim().toUpperCase();
      if (!q) return true;
      return e.clientName.toUpperCase().indexOf(q) !== -1 || e.plate.indexOf(q) !== -1;
    });

    var countNao = entries.filter(function (e) { return e.servico === "Não realizado"; }).length;
    var countAnd = entries.filter(function (e) { return e.servico === "Em andamento"; }).length;
    document.getElementById("statNaoRealizado").textContent = countNao;
    document.getElementById("statAndamento").textContent = countAnd;
    document.getElementById("statTotal").textContent = entries.length;

    var emptyMsg = document.getElementById("emptyMsg");
    var cardList = document.getElementById("cardList");

    if (filtered.length === 0) {
      emptyMsg.style.display = "block";
      cardList.style.display = "none";
      cardList.innerHTML = "";
    } else {
      emptyMsg.style.display = "none";
      cardList.style.display = "block";
      cardList.innerHTML = filtered.map(cardHtml).join("");
    }

    renderPrintReport();
    attachRowEvents();
  }

  function cardHtml(entry) {
    var checked = entry.conferido ? "checked" : "";
    var cardClass = entry.conferido ? "vcard conferido" : "vcard";
    return (
      '<div class="' + cardClass + '">' +
      '<div class="vcard-top">' +
      '<span class="vcard-plate">' + displayPlate(entry.plate) + '</span>' +
      '<input type="checkbox" class="vcard-check" data-action="toggle-conferido" data-id="' + entry.id + '" ' + checked + ' title="Conferido no pátio" />' +
      '</div>' +
      '<div class="vcard-client">' + escapeHtml(entry.clientName) + '</div>' +
      '<div class="vcard-pills">' +
      pillHtml(entry.tipoVeiculo, "var(--chrome)") +
      pillHtml(entry.servico, servicoColor(entry.servico)) +
      pillHtml(entry.chaveiro, "var(--chrome)") +
      pillHtml(entry.retirada, retiradaColor(entry.retirada)) +
      pillHtml(entry.assinatura, assinaturaColor(entry.assinatura)) +
      '</div>' +
      '<div class="vcard-footer">' +
      '<span class="vcard-user">' + escapeHtml(entry.usuarioCriacao || "") + '</span>' +
      '<div class="vcard-actions no-print">' +
      '<button class="link-btn" data-action="edit" data-id="' + entry.id + '" style="color:var(--blue-light)">Editar</button>' +
      '<button class="link-btn" data-action="delete" data-id="' + entry.id + '" style="color:var(--text-faint)">Excluir</button>' +
      '</div>' +
      '</div>' +
      '</div>'
    );
  }

  function attachRowEvents() {
    document.querySelectorAll('[data-action="edit"]').forEach(function (el) {
      el.onclick = function () { openDrawer(el.getAttribute("data-id")); };
    });
    document.querySelectorAll('[data-action="toggle-conferido"]').forEach(function (el) {
      el.onchange = function () {
        var id = el.getAttribute("data-id");
        var e = entries.find(function (x) { return x.id === id; });
        if (e) { e.conferido = el.checked; persist(); render(); }
      };
    });
    document.querySelectorAll('[data-action="delete"]').forEach(function (el) {
      el.onclick = function () {
        var id = el.getAttribute("data-id");
        if (confirmingDeleteId === id) {
          entries = entries.filter(function (x) { return x.id !== id; });
          confirmingDeleteId = null;
          persist(); render();
        } else {
          confirmingDeleteId = id;
          el.textContent = "Confirmar?";
          el.style.color = "var(--red)";
          setTimeout(function () {
            if (confirmingDeleteId === id) { confirmingDeleteId = null; render(); }
          }, 2500);
        }
      };
    });
  }

  function tableRowsForPrint(data, referenceDate) {
    return data.map(function (e) {
      return (
        "<tr>" +
        "<td style='border-bottom:1px solid #ccc;padding:7px 8px;font-family:monospace'>" + displayPlate(e.plate) + "</td>" +
        "<td style='border-bottom:1px solid #ccc;padding:7px 8px'>" + escapeHtml(e.tipoVeiculo || "") + "</td>" +
        "<td style='border-bottom:1px solid #ccc;padding:7px 8px'>" + escapeHtml(e.clientName) + "</td>" +
        "<td style='border-bottom:1px solid #ccc;padding:7px 8px'>" + escapeHtml(e.servico) + "</td>" +
        "<td style='border-bottom:1px solid #ccc;padding:7px 8px'>" + (e.chaveiro || "—") + "</td>" +
        "<td style='border-bottom:1px solid #ccc;padding:7px 8px'>" + (e.retirada || "—") + "</td>" +
        "<td style='border-bottom:1px solid #ccc;padding:7px 8px'>" + (e.assinatura || "—") + "</td>" +
        "<td style='border-bottom:1px solid #ccc;padding:7px 8px'>" + escapeHtml(e.usuarioCriacao || "") + "</td>" +
        "</tr>"
      );
    }).join("");
  }

  function renderPrintReport() {
    var target = printTarget || { date: todayKey(), data: entries };
    var label = printTarget ? formatDateLabel(printTarget.date) : document.getElementById("todayLabel").textContent;
    var sortedData = sortByPlate(target.data);
    var rows = tableRowsForPrint(sortedData, target.date);

    document.getElementById("printReport").innerHTML =
      "<div style='padding:0;color:#000;background:#fff'>" +
      "<h1 style='font-family:Georgia,serif;font-size:20px;margin-bottom:2px'>Controle de Veículos</h1>" +
      "<div style='font-size:12px;color:#555;margin-bottom:2px;text-transform:capitalize'>" + label + " · " + sortedData.length + " veículo(s)</div>" +
      "<div style='font-size:11px;color:#888;margin-bottom:14px;'>Relatório gerado/impresso em: " + formatPrintedAt() + "</div>" +
      "<table style='width:100%;border-collapse:collapse;font-size:12.5px'>" +
      "<thead><tr>" +
      ["Placa","Tipo","Cliente","Serviço(s)","Chaveiro","Retirada","Assinatura","Usuário"].map(function(h){
        return "<th style='text-align:left;border-bottom:2px solid #000;padding:7px 8px'>" + h + "</th>";
      }).join("") +
      "</tr></thead><tbody>" + rows + "</tbody></table></div>";
  }

  // ---- Drawer elements (new/edit) ----
  var overlay = document.getElementById("drawerOverlay");
  var drawerTitle = document.getElementById("drawerTitle");
  var fPlate = document.getElementById("fPlate");
  var fClientName = document.getElementById("fClientName");
  var fTipo = document.getElementById("fTipo");
  var fTipoOutroWrap = document.getElementById("fTipoOutroWrap");
  var fTipoOutro = document.getElementById("fTipoOutro");
  var fServico = document.getElementById("fServico");
  var fChaveiro = document.getElementById("fChaveiro");
  var fRetirada = document.getElementById("fRetirada");
  var fAssinatura = document.getElementById("fAssinatura");
  var fUsuario = document.getElementById("fUsuario");
  var fOutroWrap = document.getElementById("fOutroWrap");
  var fOutroNome = document.getElementById("fOutroNome");
  var saveBtn = document.getElementById("saveBtn");
  var errorBanner = document.getElementById("errorBanner");

  var chaveiroHtml = '<option value="" disabled hidden>Selecione</option>';
  chaveiroHtml += '<option value="Ignição">Ignição</option>';
  chaveiroHtml += '<option value="Com cliente">Com cliente</option>';
  for (var n = 1; n <= 40; n++) {
    var val = String(n).padStart(2, "0");
    chaveiroHtml += '<option value="' + val + '">' + val + '</option>';
  }
  fChaveiro.innerHTML = chaveiroHtml;

  fTipo.addEventListener("change", function () {
    fTipoOutroWrap.style.display = fTipo.value === "Outro" ? "block" : "none";
  });

  function refreshDependentFields() {
    var servicoDisabled = fServico.value === "Não realizado";
    var retiradaVal = fRetirada.value;

    fRetirada.disabled = servicoDisabled;
    if (servicoDisabled) {
      fRetirada.innerHTML = '<option value="">Não aplicável</option>';
      fRetirada.value = "";
    } else if (fRetirada.innerHTML.indexOf("Não aplicável") !== -1 || fRetirada.options.length === 0) {
      fRetirada.innerHTML =
        '<option value="" disabled hidden>Selecione</option>' +
        '<option value="SIM">SIM</option>' +
        '<option value="NÃO">NÃO</option>' +
        '<option value="INCERTO">INCERTO</option>';
    }
    retiradaVal = fRetirada.value;

    var assinaturaDisabled = servicoDisabled || retiradaVal === "NÃO";
    fAssinatura.disabled = assinaturaDisabled;
    if (servicoDisabled) {
      fAssinatura.innerHTML = '<option value="">Não aplicável</option>';
      fAssinatura.value = "";
    } else if (retiradaVal === "NÃO") {
      fAssinatura.innerHTML = '<option value="###">###</option>';
      fAssinatura.value = "###";
    } else if (retiradaVal === "SIM") {
      var prevA = fAssinatura.value;
      fAssinatura.innerHTML =
        '<option value="" disabled hidden>Selecione</option>' +
        '<option value="SIM">SIM</option>' +
        '<option value="NÃO">NÃO</option>';
      fAssinatura.value = (prevA === "SIM" || prevA === "NÃO") ? prevA : "";
    } else {
      var prevA2 = fAssinatura.value;
      fAssinatura.innerHTML =
        '<option value="" disabled hidden>Selecione</option>' +
        '<option value="SIM">SIM</option>' +
        '<option value="NÃO">NÃO</option>' +
        '<option value="###">###</option>';
      fAssinatura.value = prevA2 || "";
    }
  }

  fServico.addEventListener("change", refreshDependentFields);
  fRetirada.addEventListener("change", refreshDependentFields);

  fUsuario.addEventListener("change", function () {
    fOutroWrap.style.display = fUsuario.value === "Outro" ? "block" : "none";
  });

  // Cliente is displayed in uppercase visually (CSS), converted to uppercase only on save —
  // rewriting the value on every keystroke caused duplicated letters on some Android keyboards.
  fPlate.addEventListener("input", function () {
    fPlate.value = displayPlate(formatPlate(fPlate.value));
    var rawPlate = formatPlate(fPlate.value);
    if (PLATE_REGEX.test(rawPlate)) {
      buscarClienteNoHistorico(rawPlate);
      lookupClienteByPlate(rawPlate);
    } else {
      clienteStatus.style.display = "none";
    }
  });

  // ---- Preenchimento automático usando o histórico do próprio app ----
  // Procura a placa na lista ativa e em todos os dias salvos no histórico,
  // e preenche o Cliente com o registro mais recente encontrado. Não depende
  // de nenhum servidor — funciona 100% offline, com os dados que o app já tem.
  function buscarClienteNoHistorico(plate) {
    var candidatos = [];

    entries.forEach(function (e) {
      if (e.plate === plate) candidatos.push(e);
    });

    loadHistoryIndex().forEach(function (h) {
      var snap = lsGet(historySnapshotKey(h.date));
      if (snap) {
        snap.forEach(function (e) {
          if (e.plate === plate) candidatos.push(e);
        });
      }
    });

    if (candidatos.length === 0) return;

    candidatos.sort(function (a, b) { return new Date(b.createdAt) - new Date(a.createdAt); });
    var maisRecente = candidatos[0];

    if (maisRecente.clientName) {
      fClientName.value = String(maisRecente.clientName).toUpperCase();
      clienteStatus.style.display = "block";
      clienteStatus.style.color = "var(--blue-light)";
      clienteStatus.textContent = "Cliente preenchido com base no histórico — confira antes de salvar.";
    }
  }

  // ---- TCar integration: auto-fill Cliente by looking up the plate ----
  // Desativado nessa versão (hospedada no GitHub Pages) — a consulta ao TCar
  // só funciona quando o app roda pelo servidor local (na rede da oficina).
  // Preencher TCAR_API_URL reativa a tentativa de consulta automaticamente.
  // Quando ativa, tem prioridade sobre o histórico (dado mais atualizado).
  var TCAR_API_URL = "";

  var clienteStatus = document.getElementById("clienteStatus");
  var lastLookupPlate = null;

  function lookupClienteByPlate(plate) {
    if (!TCAR_API_URL) return; // integração desativada nessa versão
    if (plate === lastLookupPlate) return;
    lastLookupPlate = plate;

    clienteStatus.style.display = "block";
    clienteStatus.style.color = "var(--text-faint)";
    clienteStatus.textContent = "Consultando cadastro...";

    var url = TCAR_API_URL + "?placa=" + encodeURIComponent(plate);

    fetch(url)
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (data && data.nome) {
          fClientName.value = String(data.nome).toUpperCase();
          clienteStatus.style.color = "var(--green)";
          clienteStatus.textContent = "Cliente encontrado automaticamente.";
        } else if (data && data.notFound) {
          clienteStatus.style.color = "var(--amber)";
          clienteStatus.textContent = "Cadastro não localizado.";
        }
        // se a consulta externa não achar nada, mantém o que já veio do histórico (se houver)
      })
      .catch(function () {
        // silencioso — o preenchimento pelo histórico local (se houve) já cobre esse caso
      });
  }

  function validate() {
    var rawPlate = formatPlate(fPlate.value);
    if (rawPlate.length === 0) return "Necessário informar campo Placa.";
    if (!PLATE_REGEX.test(rawPlate)) return "Placa inválida. Use o padrão AAA0000 (antigo) ou AAA0A00 (Mercosul).";
    if (!fTipo.value) return "Necessário informar campo Tipo.";
    if (fTipo.value === "Outro" && fTipoOutro.value.trim().length === 0) return "Necessário informar o tipo do veículo.";
    if (fClientName.value.trim().length === 0) return "Necessário informar campo Cliente.";
    if (!fServico.value) return "Necessário informar campo Serviço(s).";
    if (!fChaveiro.value) return "Necessário informar campo Chaveiro.";
    if (fServico.value !== "Não realizado") {
      if (!fRetirada.value) return "Necessário informar campo Retirada.";
      if (!fAssinatura.value) return "Necessário informar campo Assinatura.";
    }
    if (!fUsuario.value) return "Necessário informar campo Usuário criação.";
    if (fUsuario.value === "Outro" && fOutroNome.value.trim().length === 0) return "Necessário informar o nome do usuário.";
    return null;
  }

  function openDrawer(id) {
    editingId = id || null;
    errorBanner.style.display = "none";
    clienteStatus.style.display = "none";
    clienteStatus.textContent = "";
    lastLookupPlate = null;
    if (editingId) {
      var e = entries.find(function (x) { return x.id === editingId; });
      drawerTitle.textContent = "Editar veículo";
      saveBtn.textContent = "Salvar alterações";
      fPlate.value = displayPlate(e.plate);
      fClientName.value = e.clientName;
      if (TIPO_OPTIONS.indexOf(e.tipoVeiculo) !== -1) {
        fTipo.value = e.tipoVeiculo;
        fTipoOutroWrap.style.display = "none";
        fTipoOutro.value = "";
      } else {
        fTipo.value = "Outro";
        fTipoOutroWrap.style.display = "block";
        fTipoOutro.value = e.tipoVeiculo || "";
      }
      fServico.value = e.servico;
      fChaveiro.value = e.chaveiro || "";
      refreshDependentFields();
      fRetirada.value = e.retirada || "";
      refreshDependentFields();
      fAssinatura.value = e.assinatura || "";
      if (USUARIOS_OPTIONS.indexOf(e.usuarioCriacao) !== -1) {
        fUsuario.value = e.usuarioCriacao;
        fOutroWrap.style.display = "none";
        fOutroNome.value = "";
      } else {
        fUsuario.value = "Outro";
        fOutroWrap.style.display = "block";
        fOutroNome.value = e.usuarioCriacao || "";
      }
    } else {
      drawerTitle.textContent = "Novo veículo";
      saveBtn.textContent = "Registrar veículo";
      fPlate.value = "";
      fClientName.value = "";
      fTipo.value = "";
      fTipoOutroWrap.style.display = "none";
      fTipoOutro.value = "";
      fServico.value = "Não realizado";
      fChaveiro.value = "";
      fUsuario.value = "";
      fOutroWrap.style.display = "none";
      fOutroNome.value = "";
      refreshDependentFields();
    }
    overlay.classList.add("open");
  }
  function closeDrawer() {
    overlay.classList.remove("open");
    editingId = null;
  }
  overlay.addEventListener("click", closeDrawer);

  saveBtn.addEventListener("click", function () {
    var err = validate();
    if (err) {
      errorBanner.textContent = err;
      errorBanner.style.display = "block";
      return;
    }
    errorBanner.style.display = "none";
    var plate = formatPlate(fPlate.value);
    var usuarioFinal = fUsuario.value === "Outro" ? fOutroNome.value.trim() : fUsuario.value;
    var tipoFinal = fTipo.value === "Outro" ? fTipoOutro.value.trim() : fTipo.value;
    if (editingId) {
      var e = entries.find(function (x) { return x.id === editingId; });
      e.plate = plate;
      e.tipoVeiculo = tipoFinal;
      e.clientName = fClientName.value.trim().toUpperCase();
      e.servico = fServico.value;
      e.chaveiro = fChaveiro.value;
      e.retirada = fRetirada.value;
      e.assinatura = fAssinatura.value;
      e.usuarioCriacao = usuarioFinal;
    } else {
      entries.unshift({
        id: uid(),
        plate: plate,
        tipoVeiculo: tipoFinal,
        clientName: fClientName.value.trim().toUpperCase(),
        servico: fServico.value,
        chaveiro: fChaveiro.value,
        retirada: fRetirada.value,
        assinatura: fAssinatura.value,
        usuarioCriacao: usuarioFinal,
        conferido: false,
        createdAt: new Date().toISOString()
      });
    }
    persist();
    closeDrawer();
    render();
  });

  document.getElementById("newBtn").addEventListener("click", function () { openDrawer(null); });
  document.getElementById("searchInput").addEventListener("input", function (e) {
    search = e.target.value;
    render();
  });

  // ---- Print (live) ----
  document.getElementById("printBtn").addEventListener("click", function () {
    printTarget = null;
    saveHistorySnapshot(todayKey(), entries);
    renderPrintReport();
    setTimeout(function () { window.print(); }, 50);
  });

  // ---- History overlay ----
  var historyOverlay = document.getElementById("historyOverlay");
  var historyListView = document.getElementById("historyListView");
  var historyDetailView = document.getElementById("historyDetailView");
  var historyListBody = document.getElementById("historyListBody");
  var historyDetailTitle = document.getElementById("historyDetailTitle");
  var historyDetailSubtitle = document.getElementById("historyDetailSubtitle");
  var historyDetailTableWrap = document.getElementById("historyDetailTableWrap");

  function renderHistoryList() {
    loadHistoryIndex();
    if (historyIndex.length === 0) {
      historyListBody.innerHTML = '<div class="history-empty">Ainda não há dias registrados no histórico.<br />Isso vai se formar automaticamente conforme os dias passam.</div>';
      return;
    }
    historyListBody.innerHTML = historyIndex.map(function (h) {
      return (
        '<button class="history-row" data-date="' + h.date + '">' +
        '<span style="font-family:\'Inter\',sans-serif;font-size:15px;color:var(--text)">' + formatDateShort(h.date) + '</span>' +
        '<span style="display:flex;align-items:center;gap:10px">' +
        '<span style="font-family:\'JetBrains Mono\',monospace;font-size:13px;color:var(--chrome)">' + h.count + ' veículo' + (h.count === 1 ? '' : 's') + '</span>' +
        '<span style="color:var(--text-faint)">\u203A</span>' +
        '</span></button>'
      );
    }).join("");
    historyListBody.querySelectorAll("[data-date]").forEach(function (el) {
      el.addEventListener("click", function () { openHistoryDate(el.getAttribute("data-date")); });
    });
  }

  function openHistoryDate(date) {
    selectedHistoryDate = date;
    historySnapshot = sortByPlate(lsGet(historySnapshotKey(date)) || []);
    historyDetailTitle.textContent = formatDateLabel(date);
    historyDetailSubtitle.textContent = historySnapshot.length + " veículo(s) registrados nesse dia · somente leitura";

    if (historySnapshot.length === 0) {
      historyDetailTableWrap.innerHTML = '<div class="history-empty">Nenhum veículo registrado nesse dia.</div>';
    } else {
      var headers = ["Placa","Tipo","Cliente","Serviço(s)","Chaveiro","Retirada","Assinatura","Usuário"];
      var thead = headers.map(function (h) {
        return '<th style="text-align:left;padding:8px 10px;border-bottom:2px solid var(--chrome);font-family:\'Inter\',sans-serif;font-size:10.5px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;white-space:nowrap">' + h + '</th>';
      }).join("");
      var rows = historySnapshot.map(function (entry, i) {
        return (
          '<tr style="background:' + (i % 2 === 0 ? 'transparent' : 'rgba(255,255,255,0.02)') + '">' +
          '<td style="padding:10px;border-bottom:1px solid var(--border);font-family:\'JetBrains Mono\',monospace;color:var(--blue-light);font-size:13px">' + displayPlate(entry.plate) + '</td>' +
          '<td style="padding:10px;border-bottom:1px solid var(--border)">' + pillHtml(entry.tipoVeiculo, "var(--chrome)") + '</td>' +
          '<td style="padding:10px;border-bottom:1px solid var(--border);font-family:\'Oswald\',sans-serif;font-size:14px;font-weight:600;color:var(--text)">' + escapeHtml(entry.clientName) + '</td>' +
          '<td style="padding:10px;border-bottom:1px solid var(--border)">' + pillHtml(entry.servico, servicoColor(entry.servico)) + '</td>' +
          '<td style="padding:10px;border-bottom:1px solid var(--border)">' + pillHtml(entry.chaveiro, "var(--chrome)") + '</td>' +
          '<td style="padding:10px;border-bottom:1px solid var(--border)">' + pillHtml(entry.retirada, retiradaColor(entry.retirada)) + '</td>' +
          '<td style="padding:10px;border-bottom:1px solid var(--border)">' + pillHtml(entry.assinatura, assinaturaColor(entry.assinatura)) + '</td>' +
          '<td style="padding:10px;border-bottom:1px solid var(--border);font-size:13px;color:var(--text-muted)">' + escapeHtml(entry.usuarioCriacao || "") + '</td>' +
          '</tr>'
        );
      }).join("");
      historyDetailTableWrap.innerHTML =
        '<div style="overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:var(--card)">' +
        '<table style="width:100%;border-collapse:collapse"><thead><tr>' + thead + '</tr></thead><tbody>' + rows + '</tbody></table></div>';
    }

    historyListView.style.display = "none";
    historyDetailView.style.display = "block";
  }

  document.getElementById("historyBtn").addEventListener("click", function () {
    selectedHistoryDate = null;
    historySnapshot = null;
    historyListView.style.display = "block";
    historyDetailView.style.display = "none";
    renderHistoryList();
    historyOverlay.classList.add("open");
  });
  document.getElementById("historyBackBtn").addEventListener("click", function () {
    selectedHistoryDate = null;
    historySnapshot = null;
    historyListView.style.display = "block";
    historyDetailView.style.display = "none";
  });
  historyOverlay.addEventListener("click", function () {
    historyOverlay.classList.remove("open");
  });
  document.getElementById("historyPrintBtn").addEventListener("click", function () {
    printTarget = { date: selectedHistoryDate, data: historySnapshot || [] };
    renderPrintReport();
    setTimeout(function () { window.print(); }, 50);
  });

  // ---- Persistence + day rollover ----
  function persist() { lsSet(ACTIVE_KEY, entries); }

  function init() {
    entries = lsGet(ACTIVE_KEY) || [];
    var today = todayKey();
    var lastDate = lsGet(LAST_DATE_KEY);

    if (lastDate && lastDate !== today) {
      saveHistorySnapshot(lastDate, entries);
    }
    if (lastDate !== today) {
      lsSet(LAST_DATE_KEY, today);
    }
    loadHistoryIndex();

    document.getElementById("todayLabel").textContent = new Date().toLocaleDateString("pt-BR", {
      weekday: "long", day: "2-digit", month: "long", year: "numeric"
    });

    refreshDependentFields();
    render();
  }

  init();

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  }
})();
</script>
</body>
</html>
